name: Test connectivité SMTP port 25

# Se lance manuellement depuis l'onglet "Actions" du repo (bouton "Run workflow"),
# ou automatiquement à chaque push sur main si tu décommentes la section "push" ci-dessous.
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

jobs:
  test-port-25:
    runs-on: ubuntu-latest
    steps:
      - name: Test connexion port 25 vers plusieurs serveurs
        run: |
          python3 - <<'EOF'
          import socket

          # On teste plusieurs cibles :
          # - gmail-smtp-in : très permissif, sert de référence "normale"
          # - adisseo.com : le domaine qui pose problème
          cibles = [
              ("gmail-smtp-in.l.google.com", 25),
              ("adisseo.com", 25),
          ]

          for host, port in cibles:
              print(f"\n--- Test {host}:{port} ---")
              try:
                  s = socket.create_connection((host, port), timeout=8)
                  banniere = s.recv(200)
                  print(f"OK - Connexion établie")
                  print(f"Bannière serveur : {banniere.decode(errors='ignore').strip()}")
                  s.close()
              except socket.timeout:
                  print("ÉCHEC - Timeout (port bloqué quelque part sur le chemin réseau)")
              except ConnectionRefusedError:
                  print("ÉCHEC - Connexion refusée (port fermé côté serveur cible)")
              except socket.gaierror as e:
                  print(f"ÉCHEC - Résolution DNS impossible : {e}")
              except Exception as e:
                  print(f"ÉCHEC - {type(e).__name__}: {e}")
          EOF
